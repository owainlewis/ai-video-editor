<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio</title>
    <link rel="stylesheet" href="./style.css" />
    <script>
      // A kept choice of light or dark, before the first paint (app/ui.tsx).
      try {
        const theme = localStorage.getItem("studio-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
      // In the Mac app the window has no title bar of its own: the header is the title bar, with the
      // traffic lights inset at its left (electron/main.ts). The stylesheet makes room for them.
      if (/\bElectron\//.test(navigator.userAgent) && /Mac/.test(navigator.platform)) document.documentElement.classList.add("mac-app");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
