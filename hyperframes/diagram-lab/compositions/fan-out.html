<template>
  <!-- Fan out, fan in: one task splits into four lanes that race at their own speeds, each ticks
       when done, then the lanes join into one result that pulses as it lands. -->
  <style>
    @font-face { font-family: "House Sans"; src: local("Helvetica Neue"), local("HelveticaNeue"), local("Helvetica"); font-weight: 400; }
    @font-face { font-family: "House Sans"; src: local("Helvetica Neue Medium"), local("HelveticaNeue-Medium"); font-weight: 500 600; }
    @font-face { font-family: "House Sans"; src: local("Helvetica Neue Bold"), local("HelveticaNeue-Bold"), local("Helvetica Bold"); font-weight: 700 900; }
    #root { position: absolute; inset: 0; font-family: "House Sans"; }
    #fo-scene { position: absolute; inset: 0; }
    #fo-kicker { position: absolute; left: 96px; top: 72px; font-weight: 600; font-size: 28px; letter-spacing: 4px; color: #a3a19c; }
    #fo-lines { position: absolute; inset: 0; }
    .fo-pill { position: absolute; padding: 24px 40px; border-radius: 22px; font-weight: 800; font-size: 44px; letter-spacing: -0.02em; white-space: nowrap; box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
    #fo-task { background: #f2efea; color: #1b1b1a; }
    #fo-result { background: #b7cdbf; color: #1b1b1a; }
    .fo-lane { position: absolute; left: 640px; width: 640px; height: 70px; display: flex; align-items: center; gap: 22px; }
    .fo-label { width: 190px; font-weight: 700; font-size: 32px; color: #f7f3ec; }
    .fo-track { position: relative; flex: 1; height: 14px; border-radius: 7px; background: rgba(247,243,236,0.12); overflow: hidden; }
    .fo-fill { position: absolute; inset: 0; background: #b7cdbf; transform-origin: left center; }
    .fo-tick { width: 44px; height: 44px; border-radius: 22px; background: #3e7b5b; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; }
  </style>
  <div id="root" data-composition-id="fan-out" data-width="1920" data-height="1080">
    <div id="fo-scene" class="clip" data-start="0" data-duration="6">
      <div id="fo-kicker">FAN OUT, FAN IN</div>
      <svg id="fo-lines" width="1920" height="1080">
        <path id="fo-o0" fill="none" stroke="rgba(247,243,236,0.3)" stroke-width="3" />
        <path id="fo-o1" fill="none" stroke="rgba(247,243,236,0.3)" stroke-width="3" />
        <path id="fo-o2" fill="none" stroke="rgba(247,243,236,0.3)" stroke-width="3" />
        <path id="fo-o3" fill="none" stroke="rgba(247,243,236,0.3)" stroke-width="3" />
        <path id="fo-i0" fill="none" stroke="rgba(183,205,191,0.6)" stroke-width="3" />
        <path id="fo-i1" fill="none" stroke="rgba(183,205,191,0.6)" stroke-width="3" />
        <path id="fo-i2" fill="none" stroke="rgba(183,205,191,0.6)" stroke-width="3" />
        <path id="fo-i3" fill="none" stroke="rgba(183,205,191,0.6)" stroke-width="3" />
      </svg>
      <div id="fo-task" class="fo-pill">Task</div>
      <div id="fo-l0" class="fo-lane"><div class="fo-label">Search</div><div class="fo-track"><div id="fo-f0" class="fo-fill"></div></div><div id="fo-t0" class="fo-tick">✓</div></div>
      <div id="fo-l1" class="fo-lane"><div class="fo-label">Read</div><div class="fo-track"><div id="fo-f1" class="fo-fill"></div></div><div id="fo-t1" class="fo-tick">✓</div></div>
      <div id="fo-l2" class="fo-lane"><div class="fo-label">Test</div><div class="fo-track"><div id="fo-f2" class="fo-fill"></div></div><div id="fo-t2" class="fo-tick">✓</div></div>
      <div id="fo-l3" class="fo-lane"><div class="fo-label">Summarise</div><div class="fo-track"><div id="fo-f3" class="fo-fill"></div></div><div id="fo-t3" class="fo-tick">✓</div></div>
      <div id="fo-result" class="fo-pill">Result</div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const OUT = "power4.out", INOUT = "power3.inOut";
      const TASK = [330, 540], RESULT = [1600, 540];
      const LANES = [330, 470, 610, 750];
      const RUN = [1.4, 2.0, 1.1, 1.7]; // each lane's own pace
      const START = 1.1;
      const done = LANES.map((_, i) => START + RUN[i]);
      const allDone = Math.max(...done);

      gsap.set(["#fo-task", "#fo-result"], { xPercent: -50, yPercent: -50 });
      gsap.set("#fo-task", { x: TASK[0], y: TASK[1] });
      gsap.set("#fo-result", { x: RESULT[0], y: RESULT[1] });
      LANES.forEach((y, i) => gsap.set(`#fo-l${i}`, { y: y - 35 }));

      const curve = (a, b) => `M ${a[0]} ${a[1]} C ${(a[0] + b[0]) / 2} ${a[1]}, ${(a[0] + b[0]) / 2} ${b[1]}, ${b[0]} ${b[1]}`;
      LANES.forEach((y, i) => {
        document.getElementById(`fo-o${i}`).setAttribute("d", curve([TASK[0] + 110, TASK[1]], [630, y]));
        document.getElementById(`fo-i${i}`).setAttribute("d", curve([1290, y], [RESULT[0] - 140, RESULT[1]]));
      });

      tl.fromTo("#fo-kicker", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: OUT }, 0.1);
      tl.fromTo("#fo-task", { opacity: 0, scale: 0.9, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: OUT }, 0.25);
      LANES.forEach((_, i) => {
        // Fan out: each line draws from the task to its lane, then the lane arrives.
        tl.fromTo(`#fo-o${i}`, { strokeDasharray: 900, strokeDashoffset: 900 }, { strokeDashoffset: 0, duration: 0.46, ease: INOUT }, 0.5 + i * 0.08);
        tl.fromTo(`#fo-l${i}`, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.18, ease: OUT }, 0.85 + i * 0.08);
        tl.fromTo(`#fo-f${i}`, { scaleX: 0 }, { scaleX: 1, duration: RUN[i], ease: "power1.inOut" }, START);
        tl.fromTo(`#fo-t${i}`, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.6)" }, done[i]);
        // Fan in once every lane is done.
        tl.fromTo(`#fo-i${i}`, { strokeDasharray: 900, strokeDashoffset: 900 }, { strokeDashoffset: 0, duration: 0.46, ease: INOUT }, allDone + 0.15 + i * 0.06);
      });
      const land = allDone + 0.15 + 0.46 + 0.18;
      tl.fromTo("#fo-result", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.18, ease: OUT }, land - 0.1);
      tl.to("#fo-result", { scale: 1.1, duration: 0.13, ease: "power2.out" }, land + 0.08);
      tl.to("#fo-result", { scale: 1, duration: 0.13, ease: "power2.in" }, land + 0.21);
      tl.to({}, { duration: 6 }, 0);
      window.__timelines["fan-out"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
